[package]
name = "nfr"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libbpf-rs = "0.27.2"
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.4", default-features = false }

[build-dependencies]
libbpf-cargo = "0.27.2"
